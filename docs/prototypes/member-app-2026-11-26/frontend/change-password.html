<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>የይለፍ ቃል ይቀይሩ | Change password</title>
    <link rel="stylesheet" href="css/fk-theme.css">
    <style>
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
               padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
               font-family: "Noto Sans Ethiopic", "Nyala", system-ui, sans-serif; color:var(--ink);
               background: linear-gradient(160deg, var(--ivory), var(--gold-light)); }
        .card { width:100%; max-width:420px; background:#fffdf5; border:2px solid var(--gold);
                border-radius:20px; padding:24px; box-shadow:0 10px 30px rgba(90,26,36,.15); }
        h1 { margin:0 0 6px; font-size:1.4rem; color:var(--wine); }
        p.note { margin:0 0 18px; font-size:.95rem; line-height:1.5; }
        label { display:block; margin:14px 0 6px; font-weight:600; }
        input { width:100%; padding:12px; font-size:1rem; border:1.5px solid #cdb26a; border-radius:12px; background:#fff; }
        input:focus-visible, button:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
        button { width:100%; margin-top:20px; padding:14px; font-size:1.05rem; font-weight:700; color:#fff;
                 background:var(--wine); border:0; border-radius:12px; cursor:pointer; }
        button:disabled { opacity:.6; cursor:wait; }
        #message { margin-top:14px; min-height:1.4em; font-weight:600; }
        #message.error { color:#a11; }
        #message.ok { color:#1b6b2f; }
    </style>
</head>
<body>
    <main class="card">
        <h1 id="title"></h1>
        <p class="note" id="note"></p>
        <form id="form" autocomplete="off">
            <label for="current" id="l-current"></label>
            <input id="current" type="password" autocomplete="current-password" required>
            <label for="new" id="l-new"></label>
            <input id="new" type="password" autocomplete="new-password" minlength="8" required>
            <label for="confirm" id="l-confirm"></label>
            <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
            <button type="submit" id="submit"></button>
            <div id="message" role="alert" aria-live="polite"></div>
        </form>
    </main>

    <script src="js/session.js"></script>
    <script>
        var lang = sessionStorage.getItem("language") === "en" ? "en" : "am";
        var T = {
            am: {
                title: "የግል ይለፍ ቃልዎን ይፍጠሩ",
                note: "ለመጀመሪያ ጊዜ በጊዜያዊ ይለፍ ቃል ገብተዋል። ለቀጣይ መግቢያ የራስዎን ይለፍ ቃል ይምረጡ (ቢያንስ 8 ፊደላት)።",
                current: "አሁን ያለው (ጊዜያዊ) ይለፍ ቃል",
                nw: "አዲስ ይለፍ ቃል",
                confirm: "አዲሱን ይለፍ ቃል ያረጋግጡ",
                submit: "ይለፍ ቃል አስቀምጥ",
                mismatch: "አዲሶቹ ይለፍ ቃሎች አይመሳሰሉም።",
                ok: "ተሳክቷል። ወደ ዳሽቦርድ በመሄድ ላይ…",
                fail: "ይለፍ ቃሉን መቀየር አልተቻለም።"
            },
            en: {
                title: "Create your private password",
                note: "You signed in with a temporary password. Choose your own password for future logins (at least 8 characters).",
                current: "Current (temporary) password",
                nw: "New password",
                confirm: "Confirm new password",
                submit: "Save password",
                mismatch: "The new passwords do not match.",
                ok: "Done. Going to your dashboard…",
                fail: "Could not change the password."
            }
        }[lang];

        document.getElementById("title").textContent = T.title;
        document.getElementById("note").textContent = T.note;
        document.getElementById("l-current").textContent = T.current;
        document.getElementById("l-new").textContent = T.nw;
        document.getElementById("l-confirm").textContent = T.confirm;
        document.getElementById("submit").textContent = T.submit;

        var message = document.getElementById("message");
        function show(text, kind) { message.textContent = text; message.className = kind || ""; }

        document.getElementById("form").addEventListener("submit", async function (event) {
            event.preventDefault();
            var current = document.getElementById("current").value;
            var nw = document.getElementById("new").value;
            var confirm = document.getElementById("confirm").value;
            if (nw !== confirm) { show(T.mismatch, "error"); return; }

            var button = document.getElementById("submit");
            button.disabled = true;
            show("", "");
            try {
                var response = await fetch("/api/auth/change-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ current_password: current, new_password: nw })
                });
                var data = await response.json().catch(function () { return {}; });
                if (response.ok && data.success) {
                    show(T.ok, "ok");
                    setTimeout(function () { window.location.href = "student-dashboard.html"; }, 800);
                } else {
                    show(data.message || T.fail, "error");
                    button.disabled = false;
                }
            } catch (e) {
                show(T.fail, "error");
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
